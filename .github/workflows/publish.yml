name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      # Use the pre-installed Node.js on the runner (no setup-node).
      # setup-node with registry-url creates .npmrc with auth token config
      # that blocks the OIDC flow. Without it, npm uses its default config
      # and OIDC auth kicks in via --provenance + id-token: write.
      - run: npm publish --provenance --access public
