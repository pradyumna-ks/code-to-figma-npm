name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/

      # setup-node with registry-url creates ~/.npmrc with _authToken=$NODE_AUTH_TOKEN
      # where NODE_AUTH_TOKEN defaults to the GitHub token. This blocks OIDC auth.
      # We create a project-level .npmrc (takes precedence) with only the registry
      # URL — no auth token — so npm uses OIDC instead.
      - run: echo "registry=https://registry.npmjs.org/" > .npmrc

      - run: npm publish --provenance --access public
